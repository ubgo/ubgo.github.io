baseURL = "https://ubgo.github.io/"
locale = "en"
title = "ubgo"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "An ecosystem of open-source Go libraries, plus a few TypeScript ones, batteries included to build apps: authentication, errors, logging, caching, config, SQL, GraphQL, HTTP services, crypto and tooling. Every library is its own Go module."
  tagline = "Batteries included for Go, one module at a time."
  github = "https://github.com/ubgo"
  ogImage = "og-card.png"

[markup.goldmark.renderer]
  unsafe = true

[sitemap]
  changeFreq = "weekly"

[minify]
  minifyOutput = true


[markup.highlight]
  noClasses = false
  lineNos = false
  guessSyntax = false

# home.json is the search index for the Ctrl/Cmd+K command palette.
[outputs]
  home = ["html", "json"]
