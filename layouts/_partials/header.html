<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 bg-white dark:bg-slate-900 px-2 py-1 rounded">Skip to content</a>
<header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-ink/80 backdrop-blur sticky top-0 z-20">
  <div class="max-w-5xl mx-auto px-4 h-12 flex items-center gap-4">
    <a href="{{ "/" | relURL }}" class="flex items-center gap-2 font-display font-bold text-[17px] tracking-tight text-slate-900 dark:text-white" aria-label="ubgo home">
      <img src="{{ "icon.svg" | relURL }}" alt="" width="24" height="24" class="size-6">ubgo
    </a>
    <nav class="flex items-center gap-1 text-[13px] ml-auto" aria-label="Main">
      {{- $cur := . }}
      {{- range slice (dict "u" "/libraries/" "t" "Libraries") (dict "u" "/about/" "t" "About") }}
      {{- $active := hasPrefix $cur.RelPermalink (relURL .u) }}
      <a href="{{ .u | relURL }}" class="px-2 h-7 inline-flex items-center rounded {{ if $active }}text-brand-700 dark:text-brand-400 font-medium{{ else }}text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white{{ end }}"{{ if $active }} aria-current="page"{{ end }}>{{ .t }}</a>
      {{- end }}
      <a href="{{ site.Params.github }}" class="px-2 h-7 inline-flex items-center gap-1 rounded text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white" rel="noopener">GitHub</a>
      <button type="button" data-theme-toggle class="ml-1 size-7 inline-flex items-center justify-center rounded border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="size-3.5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="size-3.5 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
