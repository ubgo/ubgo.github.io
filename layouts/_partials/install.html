{{- /* Copyable install line. Context: the command string. */ -}}
<div class="flex items-center gap-2 rounded-md border border-slate-200 dark:border-slate-800 bg-slate-50/90 dark:bg-slate-900/70 pl-3 pr-1 h-9 font-mono text-[12.5px] min-w-0 text-left">
  <span class="text-slate-400 select-none" aria-hidden="true">$</span>
  <code class="flex-1 truncate text-slate-800 dark:text-slate-200" data-copy-src>{{ . }}</code>
  <button type="button" data-copy class="shrink-0 h-7 px-2 rounded text-[12px] font-sans text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800" aria-label="Copy install command">Copy</button>
</div>
